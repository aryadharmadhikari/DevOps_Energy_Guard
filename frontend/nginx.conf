# Serves the built dashboard and forwards the API to the backend (CONTRACT.md section 2).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Contract section 2, unchanged. Buffering off so /stream events arrive one by one.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # Vite puts a content hash in every file name here, so they can be cached for good.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # /usage and /alerts are app routes, not files: let React Router handle them.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
