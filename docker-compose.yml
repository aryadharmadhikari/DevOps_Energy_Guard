name: energyguard

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-energyguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-energyguard}
      POSTGRES_DB: ${POSTGRES_DB:-energyguard}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: runtime
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://energyguard:energyguard@db:5432/energyguard}
      NOTIFIER_URL: ${NOTIFIER_URL:-http://notifier:8100}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      MODEL_PATH: ${MODEL_PATH:-/app/ml/models/model.pkl}
      ALERT_MERGE_MINUTES: ${ALERT_MERGE_MINUTES:-10}
      ML_SCORER: ${ML_SCORER:-package}
    # Reached through the frontend's nginx (/api). docker-compose.dev.yml publishes 8000 on this laptop only.
    expose:
      - '8000'
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s
    restart: unless-stopped

  frontend:
    profiles: [team]
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api/v1
    ports:
      - '3001:80'
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  simulator:
    profiles: [team]
    build: ./simulator
    environment:
      BACKEND_URL: ${BACKEND_URL:-http://backend:8000/api/v1}
      SIM_INTERVAL_SECONDS: ${SIM_INTERVAL_SECONDS:-5}
      SIM_METER_COUNT: ${SIM_METER_COUNT:-3}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # Not built yet. Kept in its own profile so `--profile team` runs without it;
  # the backend logs and carries on when the notifier is missing (contract 6.2).
  notifier:
    profiles: [notify]
    build: ./notifier
    environment:
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-}
      NOTIFY_COOLDOWN_SECONDS: ${NOTIFY_COOLDOWN_SECONDS:-300}
    expose:
      - '8100'
    restart: unless-stopped

  prometheus:
    profiles: [monitoring]
    image: prom/prometheus:v2.55.1
    # Only Grafana reads Prometheus, so it stays inside the Compose network.
    expose:
      - '9090'
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  grafana:
    profiles: [monitoring]
    image: grafana/grafana:11.3.1
    ports:
      - '3000:3000'
    environment:
      # Anyone can view the dashboards; only the admin can change anything.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/energyguard.json
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
